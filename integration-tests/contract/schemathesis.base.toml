# Base Schemathesis settings for the contract tests.
# run_contract_tests.py adds the hooks path and one [[operations]] block per
# operation (fixture IDs, negative-only, skip) and writes the final file to
# integration-tests/reports/contract/<suite>/schemathesis.toml.

seed = 42
continue-on-failure = true
request-timeout = 60

# The Node API allows 1,000 requests per minute (MAX_REQUESTS_PER_MINUTE).
rate-limit = "600/m"

# A run must not depend on what an earlier run left in .schemathesis/.
[cache]
enabled = false

[generation]
mode = "all"
max-examples = 10
with-security-parameters = false

# examples + coverage are deterministic, so two runs give the same test cases.
[phases.examples]
enabled = true

[phases.coverage]
enabled = true
# By default this phase also sends methods the spec does not list for a path
# (for example DELETE on a GET-only path). With real fixture IDs such a request
# can reach a route that exists but is not documented, and change or delete data.
unexpected-methods = []

[phases.fuzzing]
enabled = false

[phases.stateful]
enabled = false

[checks]
enabled = false
not_a_server_error.enabled = true
status_code_conformance.enabled = true
content_type_conformance.enabled = true
response_schema_conformance.enabled = true
positive_data_acceptance.enabled = true
negative_data_rejection.enabled = true
