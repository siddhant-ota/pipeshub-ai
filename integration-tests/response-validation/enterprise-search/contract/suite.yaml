# Contract-test suite: enterprise search (conversations, semantic search, agents).
# Routes: backend/nodejs/apps/src/modules/enterprise_search/routes/es.routes.ts
# The keys on the right-hand side (`conversation.mutable.id`, ...) are produced
# by `contract_values` in conftest.py.

name: enterprise-search

include_path_regex: "^/(conversations|search|agents)(/|$)"

# Value for each path parameter. `operations` wins over `defaults`; in
# `defaults` the first matching path prefix wins.
#
# Roles keep the operations apart, in whatever order they run: `readonly` is
# only read, `mutable` is updated, `archivable` is archived by the archive
# operation, `archived` is already archived for the unarchive operation,
# `linked` is already in a project for the project-visibility operation, and
# `disposable` is deleted by the DELETE operation.
path_parameters:
  defaults:
    - path_prefix: /agents
      values:
        agentKey: agent.main.key
        conversationId: agentConversation.mutable.id
        messageId: agentConversation.mutable.botMessageId
    - path_prefix: /conversations
      values:
        conversationId: conversation.mutable.id
        messageId: conversation.mutable.botMessageId
    - path_prefix: /search
      values:
        searchId: search.readonly.id

  operations:
    getConversationById:
      conversationId: conversation.readonly.id
    archiveConversation:
      conversationId: conversation.archivable.id
    unarchiveConversation:
      conversationId: conversation.archived.id
    setConversationProjectVisibility:
      conversationId: conversation.linked.id
    deleteConversationById:
      conversationId: conversation.disposable.id

    archiveSearch:
      searchId: search.archivable.id
    unarchiveSearch:
      searchId: search.archived.id
    deleteSearchById:
      searchId: search.disposable.id

    updateAgent:
      agentKey: agent.mutable.key
    deleteAgent:
      agentKey: agent.disposable.key
    getAgentConversationById:
      conversationId: agentConversation.readonly.id
    archiveAgentConversation:
      conversationId: agentConversation.archivable.id
    unarchiveAgentConversation:
      conversationId: agentConversation.archived.id
    setAgentConversationProjectVisibility:
      conversationId: agentConversation.linked.id
    deleteAgentConversationById:
      conversationId: agentConversation.disposable.id

# Query and body fields that get a real value wherever a request has them.
# Loading the suite fails unless every field that holds an ID is in `values`,
# `client_chosen_ids` or `ids_without_fixture`. A field applies to each
# operation that has it.
values:
  query.conversationId: conversation.readonly.id
  query.projectId: project.id
  body.projectId: project.id
  body.userIds[*]: user.second.id
  body.filters.kb[*]: knowledgeBase.id
  body.filters.apps[*]: knowledgeBase.id
  body.appliedFilters.kb[*].id: knowledgeBase.id
  body.appliedFilters.apps[*].id: knowledgeBase.id
  body.modelKey: llm.modelKey
  # An agent model is a (modelKey, modelName, provider) triple; a real key with
  # a random name or provider is still not a model that exists.
  body.models[*].modelKey: llm.modelKey
  body.models[*].modelName: llm.modelName
  body.models[*].provider: llm.provider
  body.knowledge[*].connectorId: knowledgeBase.id
  body.knowledge[*].filters.records[*]: knowledgeBase.recordId
  body.recordIds[*]: record.wellFormedId

# Values that the suite file gives itself.
constants:
  # The API accepts only a 24-hex ObjectId for `recordIds` (es_validators.ts),
  # and the IDs of indexed records are UUIDs, so there is no real value to give.
  # A well-formed one keeps the field from being the reason the API rejects an
  # invalid request, which would hide whether it rejects the invalid part.
  record.wellFormedId: "000000000000000000000000"

# ID fields whose value the client is free to choose. They keep the generated
# value, and a request with one is judged like any other.
client_chosen_ids:
  - field: body.runId
    reason: The client chooses the run ID; it names no existing resource.

# ID fields that must name something that exists, and for which no fixture
# gives a value. They keep the generated value, so a valid request with one
# names nothing real. If the API rejects it, that is not counted as a
# difference; the report says how many such requests there were.
ids_without_fixture:
  - field: body.attachments[*].recordId
    reason: Needs an uploaded chat attachment. The upload operations are skipped.
  - field: body.attachments[*].virtualRecordId
    reason: Needs an uploaded chat attachment. The upload operations are skipped.
  - field: body.tools[*]
    reason: Needs a configured toolset instance, which the fixtures do not create.
  - field: body.toolsets[*].instanceId
    reason: Needs a configured toolset instance, which the fixtures do not create.
  - field: body.webSearch.providerKey
    reason: Needs a configured web search provider, which the fixtures do not create.
  - field: body.knowledge[*].filters.recordGroups[*]
    reason: A knowledge base is addressed as an app (connectorId); there is no record-group fixture.

# Only invalid requests are sent. The backend must reject them before it
# reaches the LLM, so these runs cost nothing and still check validation.
# The success response of these operations is not checked.
negative_only:
  - reason: A valid request calls the LLM.
    operations:
      - createConversation
      - streamChat
      - addMessage
      - addMessageStream
      - regenerateAnswer
      - createAgentConversation
      - streamAgentConversation
      - addAgentConversationMessage
      - streamAgentConversationMessage
      - regenerateAgentConversationMessage

# All invalid requests are sent. Of the valid ones, only the examples that the
# spec gives, so the success response is still checked.
examples_only:
  - reason: Every valid search makes two LLM calls (query rewrite and expansion).
    operations:
      - search

# Resources that a successful test case creates; the test deletes them at the end.
# `{id}` is the value at `id_pointer` in the response; other `{...}` are value keys.
created_resources:
  - operation: createAgent
    id_pointer: /agent/_key
    delete_path: /agents/{id}
  - operation: search
    id_pointer: /searchId
    delete_path: /search/{id}
  # Negative-only, but the backend can accept a request that the spec forbids.
  - operation: createConversation
    id_pointer: /conversation/_id
    delete_path: /conversations/{id}
  - operation: createAgentConversation
    id_pointer: /conversation/_id
    delete_path: /agents/{agent.main.key}/conversations/{id}

skip:
  - operation: deleteSearchHistory
    reason: Deletes all search history of the user, which removes the search fixtures.
  - operation: uploadConversationChatAttachments
    reason: Multipart file upload. Needs a file fixture.
  - operation: deleteConversationChatAttachment
    reason: Needs an uploaded attachment fixture.
  - operation: uploadAgentConversationChatAttachments
    reason: Multipart file upload. Needs a file fixture.
  - operation: deleteAgentConversationChatAttachment
    reason: Needs an uploaded attachment fixture.
