# Contract-test suite: enterprise search (conversations, semantic search, agents,
# projects, chat speech).
# Routes: backend/nodejs/apps/src/modules/enterprise_search/routes/es.routes.ts
#         (the chat speech routes are `createChatSpeechRouter` in the same file)
#         backend/nodejs/apps/src/modules/projects/routes/project.routes.ts
# The keys on the right-hand side (`conversation.mutable.id`, ...) are produced
# by `contract_values` in conftest.py.

name: enterprise-search

include_path_regex: "^/(conversations|search|agents|projects|chat)(/|$)"

# Value for each path parameter. `operations` wins over `defaults`; in
# `defaults` the first matching path prefix wins.
#
# Roles keep the operations apart, in whatever order they run: `readonly` is
# only read, `mutable` is updated, `archivable` is archived by the archive
# operation, `archived` is already archived for the unarchive operation,
# `linked` is already in a project for the project-visibility operation, and
# `disposable` is deleted by the DELETE operation.
#
# Projects have more: `pinnable` is there to be pinned and `pinned` already is,
# `kbHost` gets its hidden knowledge base from the operation under test, and
# `membersReadonly`, `membersMutable` and `membersDisposable` are the same three
# roles for the member list of a project. `project.id` is the project that the
# linked conversations are in; no project operation changes it.
path_parameters:
  defaults:
    - path_prefix: /agents
      values:
        agentKey: agent.main.key
        conversationId: agentConversation.mutable.id
        messageId: agentConversation.mutable.botMessageId
    - path_prefix: /conversations
      values:
        conversationId: conversation.mutable.id
        messageId: conversation.mutable.botMessageId
    - path_prefix: /search
      values:
        searchId: search.readonly.id
    - path_prefix: /projects
      values:
        projectId: project.readonly.id
        memberUserId: user.second.id

  operations:
    getConversationById:
      conversationId: conversation.readonly.id
    archiveConversation:
      conversationId: conversation.archivable.id
    unarchiveConversation:
      conversationId: conversation.archived.id
    setConversationProjectVisibility:
      conversationId: conversation.linked.id
    deleteConversationById:
      conversationId: conversation.disposable.id

    archiveSearch:
      searchId: search.archivable.id
    unarchiveSearch:
      searchId: search.archived.id
    deleteSearchById:
      searchId: search.disposable.id

    updateAgent:
      agentKey: agent.mutable.key
    deleteAgent:
      agentKey: agent.disposable.key
    getAgentConversationById:
      conversationId: agentConversation.readonly.id
    archiveAgentConversation:
      conversationId: agentConversation.archivable.id
    unarchiveAgentConversation:
      conversationId: agentConversation.archived.id
    setAgentConversationProjectVisibility:
      conversationId: agentConversation.linked.id
    deleteAgentConversationById:
      conversationId: agentConversation.disposable.id

    deleteConversationChatAttachment:
      recordId: attachment.disposable.id
    deleteAgentConversationChatAttachment:
      recordId: agentAttachment.disposable.id

    updateProject:
      projectId: project.mutable.id
    deleteProject:
      projectId: project.disposable.id
    archiveProject:
      projectId: project.archivable.id
    unarchiveProject:
      projectId: project.archived.id
    pinProject:
      projectId: project.pinnable.id
    unpinProject:
      projectId: project.pinned.id
    getProjectConversations:
      projectId: project.id
    ensureProjectKnowledgeBase:
      projectId: project.kbHost.id
    listProjectMembers:
      projectId: project.membersReadonly.id
    upsertProjectMembers:
      projectId: project.membersMutable.id
    removeProjectMember:
      projectId: project.membersDisposable.id

# Query and body fields that get a real value wherever a request has them.
# Loading the suite fails unless every field that holds an ID is in `values`,
# `client_chosen_ids` or `ids_without_fixture`. A field applies to each
# operation that has it.
values:
  query.conversationId: conversation.readonly.id
  query.projectId: project.id
  body.projectId: project.id
  body.userIds[*]: user.second.id
  body.filters.kb[*]: knowledgeBase.id
  body.filters.apps[*]: knowledgeBase.id
  body.appliedFilters.kb[*].id: knowledgeBase.id
  body.appliedFilters.apps[*].id: knowledgeBase.id
  body.modelKey: llm.modelKey
  # The API wants a model name and a friendly name that are not empty
  # (es_validators.ts, modelFieldsSchema). `AddMessageRequest` in the spec has
  # no `minLength` for the two, so Schemathesis sends "" in every request of
  # `addMessage` and `addMessageStream`, and the API would reject each of them
  # for the name and not for its invalid part. The values hide that gap.
  body.modelName: llm.modelName
  body.modelFriendlyName: llm.modelName
  # An agent model is a (modelKey, modelName, provider) triple; a real key with
  # a random name or provider is still not a model that exists.
  body.models[*].modelKey: llm.modelKey
  body.models[*].modelName: llm.modelName
  body.models[*].provider: llm.provider
  body.knowledge[*].connectorId: knowledgeBase.id
  body.knowledge[*].filters.records[*]: knowledgeBase.recordId
  body.recordIds[*]: record.wellFormedId
  # The spec has no length limit for an item of `knowledgeScope`; the API wants 1
  # to 200 characters (project.validators.ts). Schemathesis sends an empty one,
  # so without the value no valid request with a scope could succeed. The value
  # hides that gap in the spec.
  body.knowledgeScope.kb[*]: knowledgeBase.id
  body.knowledgeScope.apps[*]: knowledgeBase.id
  body.members[*].principalId: user.second.id
  # A real file for each file of an attachment upload. Without it Schemathesis
  # sends empty files with no content type, and the API answers 400 to those.
  body.files[*]: attachment.file.path

# The same for one operation; it wins over `values` and the two lists of IDs.
values_by_operation:
  # For an agent, `tools` must name tools that exist (`ids_without_fixture`). A
  # project stores the names as they come (project.validators.ts), so here every
  # name is valid and a rejection must be judged. The spec has no length limit
  # for a name; the API wants 1 to 200 characters. Schemathesis sends empty
  # names, so without the value no valid request with `tools` could succeed.
  # The value hides that gap in the spec.
  createProject:
    body.tools[*]: project.toolName
  updateProject:
    body.tools[*]: project.toolName
  # For an agent the API accepts `quick` only, and so does the spec
  # (`AgentRegenerateRequest`). Schemathesis takes `internal_search` from the
  # example of `RegenerateRequest`, which the agent schema extends, and the API
  # would reject each request for the chat mode and not for its invalid part.
  regenerateAgentConversationMessage:
    body.chatMode: chatMode.quick

# Values that the suite file gives itself.
constants:
  # The API accepts only a 24-hex ObjectId for `recordIds` (es_validators.ts),
  # and the IDs of indexed records are UUIDs, so there is no real value to give.
  # A well-formed one keeps the field from being the reason the API rejects an
  # invalid request, which would hide whether it rejects the invalid part.
  record.wellFormedId: "000000000000000000000000"
  project.toolName: contract.tool
  chatMode.quick: quick

# ID fields whose value the client is free to choose. They keep the generated
# value, and a request with one is judged like any other.
client_chosen_ids:
  - field: body.runId
    reason: The client chooses the run ID; it names no existing resource.
  - field: body.conversationId
    reason: >-
      An upload does not look the conversation up. The API returns the ID as it
      got it (backend/python/app/api/routes/chatbot.py, upload_chat_attachments).

# ID fields that must name something that exists, and for which no fixture
# gives a value. They keep the generated value, so a valid request with one
# names nothing real. If the API rejects it, that is not counted as a
# difference; the report says how many such requests there were.
ids_without_fixture:
  # Only the operations that call the LLM have these two. They are sent invalid
  # requests, and at most one example, which has no attachment. The API checks
  # the form of an attachment reference, not that the attachment exists
  # (es_validators.ts, attachmentRefSchema), so a real ID changes no rejection.
  # In an invalid request that the API accepts, a real ID would put the file
  # into the LLM turn.
  - field: body.attachments[*].recordId
    reason: A real attachment would change no rejection, and add its file to an LLM turn.
  - field: body.attachments[*].virtualRecordId
    reason: A real attachment would change no rejection, and add its file to an LLM turn.
  - field: body.tools[*]
    reason: Needs a configured toolset instance, which the fixtures do not create.
  - field: body.toolsets[*].instanceId
    reason: Needs a configured toolset instance, which the fixtures do not create.
  - field: body.webSearch.providerKey
    reason: Needs a configured web search provider, which the fixtures do not create.
  - field: body.knowledge[*].filters.recordGroups[*]
    reason: A knowledge base is addressed as an app (connectorId); there is no record-group fixture.

# Only invalid requests are sent, and the success response is not checked.
#
# This costs nothing only while the API rejects each of these requests. It
# starts an LLM turn for every invalid request that it accepts, and the run
# reports that request as a difference. The API drops a property that the spec
# does not know and handles the request, so the library sends that one case
# without a login. A stream operation saves its conversation and answers 200
# before it calls the LLM; `contract_project` deletes those conversations.
negative_only:
  - reason: A valid request calls the LLM, and the answer is a stream.
    operations:
      - streamChat
      - addMessageStream
      - regenerateAnswer
      - streamAgentConversation
      - streamAgentConversationMessage
      - regenerateAgentConversationMessage

# All invalid requests are sent. Of the valid ones, only the examples of the
# spec, so the success response is still checked.
examples_only:
  # A run sends 2 examples, which is 4 LLM calls. The fixtures make 5 more
  # searches (10 LLM calls). Both examples have a `limit`: a search with no
  # `limit` is answered 500, after the LLM calls. `limit` is optional for the
  # validator (es_validators.ts, enterpriseSearchSearchSchema) and required
  # when the search is saved (search.schema.ts).
  - reason: Every valid search makes two LLM calls (query rewrite and expansion).
    operations:
      - search
  # The spec has no request example for these four. Schemathesis makes one from
  # the examples of the fields, so a run sends 1 valid request to each of them:
  # 4 LLM turns.
  - reason: A valid request is one LLM turn.
    operations:
      - createConversation
      - addMessage
      - createAgentConversation
      - addAgentConversationMessage

# An LLM turn or a search can take longer than the 60 seconds that a request
# gets by default. The fixtures give the same calls 180 seconds.
operation_timeouts:
  search: 180
  createConversation: 180
  addMessage: 180
  createAgentConversation: 180
  addAgentConversationMessage: 180

# Sent in full, and still no request can get a 2xx.
no_success_response:
  - operation: synthesizeChatSpeech
    reason: >-
      The operation is sent only to a deployment with no text-to-speech provider
      (see `requires`), and without one the API answers 409 to a valid request.
  - operation: transcribeChatAudio
    reason: >-
      The operation is sent only to a deployment with no speech-to-text provider
      (see `requires`), and without one the API answers 409 to a valid request.

# How an operation logs in, where the login that the spec gives must not be used.
auth:
  # The operation deletes every search of the caller that is not archived, and
  # those that others shared with the caller (es_controller.ts,
  # deleteSearchHistory). With the OAuth client that is the search fixtures of
  # the operations after it. The second user owns one search, which a fixture
  # makes for this operation, and no search is shared with that user.
  deleteSearchHistory:
    token: user.second.token

# Values that an operation needs and that go into no request.
requires:
  # With a provider, a valid request calls it and costs money. So does an invalid
  # one: the API takes an unknown `format` as mp3 and clamps `speed`, it does not
  # reject them (backend/python/app/api/routes/speech.py). The fixture behind the
  # key skips when a provider is configured, and the operation is then skipped.
  synthesizeChatSpeech:
    - speech.tts.provider
  transcribeChatAudio:
    - speech.stt.provider
  # An empty list matches the spec whatever a conversation in it looks like, so
  # the project must have the linked conversations in it.
  getProjectConversations:
    - conversation.linked.id

# Resources that a successful test case creates; the test deletes them at the end.
# `{id}` is the value at `id_pointer` in the response; other `{...}` are value keys.
created_resources:
  - operation: createAgent
    id_pointer: /agent/_key
    delete_path: /agents/{id}
  - operation: search
    id_pointer: /searchId
    delete_path: /search/{id}
  - operation: createProject
    id_pointer: /project/_id
    delete_path: /projects/{id}
  # One valid example each, and the API can accept a request that the spec forbids.
  - operation: createConversation
    id_pointer: /conversation/_id
    delete_path: /conversations/{id}
  - operation: createAgentConversation
    id_pointer: /conversation/_id
    delete_path: /agents/{agent.main.key}/conversations/{id}
  # An upload answers with one attachment for each file, and takes 10 files at most.
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/0/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/1/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/2/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/3/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/4/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/5/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/6/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/7/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/8/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadConversationChatAttachments, id_pointer: /attachments/9/recordId, delete_path: "/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/0/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/1/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/2/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/3/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/4/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/5/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/6/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/7/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/8/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
  - {operation: uploadAgentConversationChatAttachments, id_pointer: /attachments/9/recordId, delete_path: "/agents/{agent.main.key}/conversations/attachments/{id}"}
